<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Future Members - Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: #d4af37;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        header p {
            color: white;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,.08);
        }

        .card h2 {
            font-size: 36px;
            margin: 10px 0;
            color: #111;
        }

        .card p {
            margin: 0;
            color: #666;
        }

        .actions {
            margin-top: 35px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }

        .button {
            display: inline-block;
            padding: 14px 25px;
            background: #111;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .button.gold {
            background: #d4af37;
            color: #111;
        }
    </style>
</head>

<body>

<header>
    <h1>FUTURE MEMBERS</h1>
    <p>لوحة إدارة العضوية</p>
</header>

<div class="container">

    <div class="cards">

        <div class="card">
            <p>إجمالي الأعضاء</p>
            <h2>{{ total }}</h2>
        </div>

        <div class="card">
            <p>العضويات النشطة</p>
            <h2>{{ active }}</h2>
        </div>

        <div class="card">
            <p>قيد المراجعة</p>
            <h2>{{ pending }}</h2>
        </div>

        <div class="card">
            <p>قريبة الانتهاء</p>
            <h2>{{ expiring }}</h2>
        </div>

        <div class="card">
            <p>منتهية</p>
            <h2>{{ expired }}</h2>
        </div>

    </div>

    <div class="actions">

        <a class="button gold" href="/register/">
            + إضافة عضو
        </a>

        <a class="button" href="/admin/members/member/">
            إدارة الأعضاء
        </a>

        <a class="button" href="/verify/FM-2026-0001/">
            التحقق من عضوية
        </a>

    </div>

</div>

</body>
</html>
